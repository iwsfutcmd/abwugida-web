<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <script src="./cmu.json.js"></script>
    <script src="./alice_dict.json.js"></script>
    <script src="./main.js"></script>
    <script type="text/javascript">
        function update() {
            try {

                let details = getDetails(document.getElementById('text').value);
                document.getElementById('output').innerHTML = details.html;
                document.getElementById('ipa-output').innerHTML = details.ipa;
                document.getElementById('string-output').innerHTML = details.string;   
            } catch (e) {
                output.innerHTML = `<span class=unknown>Got error: ${e}</span>`
            }
        }

    </script>

    <style type="text/css">
.space {
    width: 40px;
    display: inline-block;
}

.syllable,.char {
    height: 100px;
    display: inline-block;
    position: relative;
    top: 0;
    left: 0;
    margin-bottom: 20px;
    vertical-align: middle;
}
.char {
    font-size: 80px;
    padding-left: 20px;
    width: 20px;
}
.charbox {
  width: 40px;
  height: 100px;
  position: relative;
  top: 0;
  left: 0;
}
.consonant {
  width: 100px;
  height: 100px;
}
.vowel {
  width: 30px;
  height: 30px;
}
.syllable {
  /* The wug images have some spacing, remove that for better æsthetics */
/*  margin-left: -5px;*/
  margin-right: -15px;
  width: 100px;
}
.syllable .consonant {
  position: relative;
  top: 0;
  left: 0;
}
.syllable .vowel {
  position: absolute;
  left: 70px;
  z-index: 1;

}


/* If vowels are on voiceless bases, they can be made to live on the wugbeak */
/*.syllable .vowel.voiceless-base {
  left: 0px;
}*/

.syllable .vowel-fat_ha,.syllable .vowel-dommah,.syllable .vowel-schwa {
  top: -7px;
}
.syllable .vowel-kas_rah {
  top: 75px;
}

.unknown {
    color: red;
}
#output {
    margin-top: 50px;
}
</style>
</head>
<body>
<label for=text>Text: </label><br><textarea id="text" name="text" rows=3 cols=70 onkeyup="update()"> </textarea><br>
IPA: <span id="ipa-output"></span><br>
Parsed: <span id="string-output"></span>


<br><br><br>
<div id="output">


</div>

<script type="text/javascript">update()</script>
</body>
</html>
