<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <script src="./cmu.json.js"></script>
    <script src="./alice_dict.json.js"></script>
    <script src="./abwugida_map.json.js"></script>
    <script src="./jyutping.json.js"></script>
    <script src="./main.js"></script>
    <script type="text/javascript">
      function update() {
        try {
          const mode = document.querySelector('input[name="mode"]:checked')?.value || 'english';
          const text = document.getElementById("text").value;
          let details;
          if (mode === 'arabizi') {
            details = arabiziToDetails(text);
          } else if (mode === 'cantonese') {
            details = cantoneseToDetails(text);
          } else if (mode === 'glyphs') {
            details = { ipa: '', string: '', cps: text };
          } else {
            details = getDetails(text);
          }
          const clickerSection = document.getElementById("clicker-section");
          if (clickerSection) clickerSection.style.display = mode === 'glyphs' ? '' : 'none';
          const phoneticOutput = document.getElementById("phonetic-output");
          if (phoneticOutput) phoneticOutput.style.display = mode === 'glyphs' ? 'none' : '';
          if (details.ipa.length > 1000) {
            details.ipa = `<details><summary>Show IPA</summary>${details.ipa}</details>`;
          }
          if (details.string.length > 1000) {
            details.string = `<details><summary>Show</summary>${details.string}</details>`;
          }
          document.getElementById("ipa-output").innerHTML = details.ipa;
          document.getElementById("string-output").innerHTML = details.string;
          [...document.getElementsByClassName("abwugida")].forEach(
            (e) => (e.innerHTML = details.cps)
          );
          const ct = document.getElementById("circle-text");
          if (ct) ct.innerHTML = details.cps + " ";
          fitCircleText();
        } catch (e) {
          output.innerHTML = `<span class=unknown>Got error: ${e}</span>`;
        }
      }

      function setFontSize() {
        const fontSize = document.getElementById("fontsize").value + "px";
        [...document.getElementsByClassName("abwugida")].forEach(
          (e) => (e.style.fontSize = fontSize)
        );
        fitCircleText();
      }

      async function downloadCircleSVG() {
        const svg = document.getElementById("circle-svg");

        // Fetch font and encode as base64
        const fontResp = await fetch("font/Abwugida-Regular.ttf");
        const fontBuf = await fontResp.arrayBuffer();
        const bytes = new Uint8Array(fontBuf);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        const fontB64 = btoa(binary);

        // Compute viewBox from circle geometry + font size.
        // Baseline sits on the circle (r=340, center 400,400); glyphs extend
        // up to ~1 font-size outward from the baseline in any direction.
        const tspan = document.getElementById("circle-text");
        const fsPx = parseFloat(window.getComputedStyle(tspan).fontSize) || 80;
        const svgDisplayWidth = svg.getBoundingClientRect().width || 600;
        const fsSVG = fsPx * 800 / svgDisplayWidth;
        const pad = Math.ceil(fsSVG * 2) + 10;
        const cx = 400, cy = 400, r = 340;
        const vx = cx - r - pad, vy = cy - r - pad, vsize = (r + pad) * 2;

        const clone = svg.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        clone.setAttribute("viewBox", `${vx} ${vy} ${vsize} ${vsize}`);
        clone.setAttribute("width", vsize);
        clone.setAttribute("height", vsize);
        clone.setAttribute("overflow", "visible");
        clone.removeAttribute("style");

        // Embed font + class styles so the SVG is self-contained
        const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
        style.textContent = `
          @font-face { font-family: "Abwugida"; src: url("data:font/truetype;base64,${fontB64}"); font-weight: 400; }
          .abwugida { font-family: "Abwugida"; }
          .regular { font-weight: 400; }
        `;
        clone.insertBefore(style, clone.firstChild);

        const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" });
        const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "abwugida-circle.svg" });
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function fitCircleText() {
        const tspan = document.getElementById("circle-text");
        if (!tspan || !tspan.textContent) return;
        const len = tspan.getComputedTextLength();
        if (!len) return;
        const currentSize = parseFloat(window.getComputedStyle(tspan).fontSize);
        tspan.style.fontSize = (currentSize * 2 * Math.PI * 340 / len) + "px";
      }

      let CHARMAP = {};
      fetch("./charmap.json")
        .then((r) => r.text())
        .then((t) => {
          // Tolerate trailing commas in the source JSON.
          CHARMAP = JSON.parse(t.replace(/,(\s*[}\]])/g, "$1"));
        })
        .catch((e) => console.warn("Could not load charmap.json:", e));

      function glyphsKeydown(e) {
        if (e.metaKey) return;
        const mode = document.querySelector('input[name="mode"]:checked')?.value;
        if (mode !== "glyphs") return;

        // AltGr + Digit1..8 → tones E120..E127
        // (AltGraph on Linux/Win, Option on Mac, ctrl+alt on Win all set altKey)
        const altGr = e.getModifierState("AltGraph") || e.altKey;
        if (altGr) {
          const m = /^Digit([1-8])$/.exec(e.code);
          if (m) {
            const n = parseInt(m[1], 10) - 1;
            e.preventDefault();
            insertAtCursor(String.fromCharCode(0xe120 + n));
          }
          return;
        }

        if (e.ctrlKey) return;

        // o / O → carriers (blank_backward / blank_forward)
        if (e.key === "o" || e.key === "O") {
          e.preventDefault();
          insertAtCursor(
            e.key === "o"
              ? ABWUGIDA_MAP["blank_backward"]
              : ABWUGIDA_MAP["blank_forward"]
          );
          return;
        }

        // Character-based charmap (consonants, vowels, special chars)
        const ch = CHARMAP[e.key];
        if (ch) {
          e.preventDefault();
          insertAtCursor(ch);
        }
      }

      function insertAtCursor(ch) {
        const textarea = document.getElementById("text");
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        textarea.value =
          textarea.value.slice(0, start) + ch + textarea.value.slice(end);
        const pos = start + ch.length;
        textarea.focus();
        textarea.setSelectionRange(pos, pos);
        update();
      }


      function buildClicker() {
        const carrierCh = ABWUGIDA_MAP["blank_forward"];
        const namedEntries = (keys) =>
          keys.map((key) => ({ label: key, ch: ABWUGIDA_MAP[key] }));
        const hexRange = (start, end) => {
          const out = [];
          for (let c = start; c <= end; c++) {
            out.push({
              label: `U+${c.toString(16).toUpperCase()}`,
              ch: String.fromCharCode(c),
            });
          }
          return out;
        };
        const codepointTitle = (ch) =>
          Array.from(ch)
            .map((c) => `U+${c.codePointAt(0).toString(16).toUpperCase()}`)
            .join(" ");
        const groups = [
          {
            name: "Consonants",
            entries: namedEntries([
              "p", "b", "t", "d", "k", "g", "q", "ʔ",
              "tʃ", "dʒ", "s", "z", "ʃ", "ʒ", "f", "v",
              "θ", "ð", "x", "ɣ", "ħ", "ʕ", "h",
              "m", "n", "ɲ", "ŋ", "r", "l", "w", "j",
              "tˤ", "dˤ", "sˤ", "zˤ", "ɫ", "ðˤ", "ɥ",
            ]),
          },
          {
            name: "Vowels",
            isCombining: true,
            entries: namedEntries(["aː", "iː", "uː", "a", "i", "u"]),
          },
          {
            name: "Tones",
            isCombining: true,
            entries: hexRange(0xe120, 0xe127),
          },
          { name: "Carriers", entries: hexRange(0xe200, 0xe201) },
          { name: "Accessories (E3xx)", entries: hexRange(0xe300, 0xe316) },
        ];

        const container = document.getElementById("clicker");
        groups.forEach((group) => {
          const heading = document.createElement("div");
          heading.className = "clicker-heading";
          heading.textContent = group.name;
          container.appendChild(heading);
          const grid = document.createElement("div");
          grid.className = "clicker-grid";
          group.entries.forEach(({ label, ch }) => {
            if (!ch) return;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "clicker-btn";
            btn.title = `${label} (${codepointTitle(ch)})`;
            btn.onclick = () => insertAtCursor(ch);
            const glyph = document.createElement("span");
            glyph.className = "clicker-glyph";
            if (group.isCombining) {
              // Combining marks need a (greyed) carrier so the glyph renders.
              const carrier = document.createElement("span");
              carrier.className = "clicker-carrier";
              carrier.textContent = carrierCh;
              glyph.appendChild(carrier);
              glyph.appendChild(document.createTextNode(ch));
            } else {
              glyph.textContent = ch;
            }
            btn.appendChild(glyph);
            const lab = document.createElement("span");
            lab.className = "clicker-label";
            lab.textContent = label;
            btn.appendChild(lab);
            grid.appendChild(btn);
          });
          container.appendChild(grid);
        });
      }
    </script>

    <style type="text/css">
      @font-face {
        font-family: "Abwugida";
        src: url("font/Abwugida-Regular.ttf");
        font-weight: 400;
      }

      @font-face {
        font-family: "Abwugida";
        src: url("font/Abwugida-Thin.ttf");
        font-weight: 100;
      }

      @font-face {
        font-family: "Abwugida";
        src: url("font/Abwugida-Bold.ttf");
        font-weight: 700;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
      }
      .help {
        position: absolute;
        background-color: white;
        border: 1px black solid;
        inset-inline-start: 0px;
      }
      #text {
        inline-size: 100%;
        box-sizing: border-box;
      }
      .abwugida {
        font-family: "Abwugida";
      }

      .regular {
        font-weight: 400;
      }

      .thin {
        font-weight: 100;
      }

      .bold {
        font-weight: 700;
      }

      /* Most content boxes have something inside them that needs to be positioned */
      .unknown {
        height: 1em;
        display: inline-block;
        position: relative;
        top: 0;
        left: 0;
        margin-bottom: 0.2em;
        vertical-align: middle;
      }
      .unknown {
        color: red;
        width: fit-content;
      }
      #outputbox summary {
        font-size: 12pt;
      }
      #output {
        margin-top: 0.07em; /* bare minimum from fatha/dommah/schwa positioning */
        margin-bottom: 0.05em; /* bare minimum from kasrah positioning = 0.75 + 0.3 - 1 */
        box-decoration-break: slice;
      }
      #display {
        padding: 0.4em 0.3em;
      }
      #clicker {
        margin: 0.5em 0;
      }
      .clicker-heading {
        font-weight: bold;
        margin-top: 0.5em;
        font-size: 11pt;
      }
      .clicker-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      .clicker-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
        min-width: 44px;
        cursor: pointer;
        background: white;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      .clicker-btn:hover {
        background: #eef;
        border-color: #88a;
      }
      .clicker-btn:active {
        background: #dde;
      }
      .clicker-glyph {
        font-family: "Abwugida";
        font-weight: 400;
        font-size: 28px;
        line-height: 1;
      }
      .clicker-carrier {
        opacity: 0.2;
      }
      .clicker-label {
        font-size: 10px;
        color: #555;
        margin-top: 3px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="download-button" href="font/Abwugida-Regular.ttf" download>
        <button>Download Font</button>
      </a>
      <a href="grid.html"><button>Carrier × Accessory grid</button></a>
    </header>
    <div id="display" class="abwugida"></div>
    <div id="form">
      <label>Mode: </label>
      <label><input type="radio" name="mode" value="english" checked onchange="update()"> English</label>
      <label><input type="radio" name="mode" value="arabizi" onchange="update()"> Arabizi (Lebanese)</label>
      <label><input type="radio" name="mode" value="cantonese" onchange="update()"> Cantonese (Jyutping)</label>
      <label><input type="radio" name="mode" value="glyphs" onchange="update()"> Glyphs</label>
      <br /><br />
      <label for="text">Text: </label><br /><textarea
        id="text"
        name="text"
        rows="3"
        cols="70"
        onkeyup="update()"
      ></textarea
      ><br />
      <div id="clicker-section" style="display: none">
        <div id="clicker"></div>
      </div>
      <label for="fontsize">Set font size (px): </label>
      <input
        type="number"
        name="fontsize"
        id="fontsize"
        value="80"
        onchange="setFontSize()"
      /><br />

      <div id="phonetic-output">
        IPA: <span id="ipa-output"></span><br />
        Parsed: <span id="string-output"></span><br />
      </div>
      <button onclick="document.getElementById('form').style.display = 'none'">
        Hide controls (for printing)
      </button>

      <br /><br /><br />
    </div>
    <details>
      <summary>~~</summary>
      <svg
        width="800"
        height="400"
        viewBox="0 0 800 200"
        xmlns="http://www.w3.org/2000/svg"
        style="inline-size: 100%"
      >
        <!-- Define the sine wave path -->
        <path
          id="sineWave"
          d="M0 100 Q 100 0 200 100 T 400 100 T 600 100 T 800 100"
          fill="transparent"
          stroke="black"
        />

        <!-- Create the text element and place it on the path -->
        <text font-size="16">
          <textPath href="#sineWave" id="textPath">
            <tspan class="abwugida regular" />
            &nbsp;
          </textPath>
          <animate
            xlink:href="#textPath"
            attributeName="startOffset"
            from="-100%"
            to="100%"
            dur="10s"
            repeatCount="indefinite"
          />
        </text>
      </svg>
    </details>
    <details ontoggle="fitCircleText()">
      <summary>○</summary>
      <button onclick="downloadCircleSVG()">Download SVG</button>
      <svg
        id="circle-svg"
        viewBox="0 0 800 800"
        xmlns="http://www.w3.org/2000/svg"
        style="max-width: 600px; width: 100%; display: block; margin: auto"
        overflow="visible"
      >
        <defs>
          <!-- Circle path starting at 12 o'clock, going clockwise in four quarter-arcs -->
          <path id="circlePath" d="M 400,60 a 340,340 0 0,1 340,340 a 340,340 0 0,1 -340,340 a 340,340 0 0,1 -340,-340 a 340,340 0 0,1 340,-340" />
        </defs>
        <circle cx="400" cy="400" r="340" fill="none" stroke="#ccc" stroke-width="2" />
        <text>
          <textPath href="#circlePath">
            <tspan class="abwugida regular" id="circle-text" />
          </textPath>
        </text>
      </svg>
    </details>
    <details>
      <summary>thin</summary>
      <div class="abwugida thin"></div>
    </details>
    <details>
      <summary>bold</summary>
      <div class="abwugida bold"></div>
    </details>

    <script type="text/javascript">
      buildClicker();
      document.getElementById("text").addEventListener("keydown", glyphsKeydown);
      update();
      setFontSize();
    </script>
  </body>
</html>
