<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <script src="./cmu.json.js"></script>
    <script src="./alice_dict.json.js"></script>
    <script src="./main.js"></script>
    <script type="text/javascript">
        function update() {
            try {

                let details = getDetails(document.getElementById('text').value);
                document.getElementById('output').innerHTML = details.html;
                if (details.ipa.length > 1000) {
                    details.ipa = `<details><summary>Show IPA</summary>${details.ipa}</details>`
                }
                if (details.string.length > 1000) {
                    details.string = `<details><summary>Show</summary>${details.string}</details>`
                }
                document.getElementById('ipa-output').innerHTML = details.ipa;
                document.getElementById('string-output').innerHTML = details.string;   
            } catch (e) {
                output.innerHTML = `<span class=unknown>Got error: ${e}</span>`
            }
        }

        function setFontSize() {
            document.getElementById('output').style.fontSize = document.getElementById('fontsize').value + "px";
        }

    </script>

    <style type="text/css">
/* Spaces */
.space {
    width: 0.4em;
    display: inline-block;
}

/* Most content boxes have something inside them that needs to be positioned */
.syllable,.char,.unknown,.punct {
    height: 1em;
    display: inline-block;
    position: relative;
    top: 0;
    left: 0;
    margin-bottom: 0.2em;
    vertical-align: middle;
}
.char,.punct {
    width: fit-content;
    z-index: 1;
}

/* Sizes for content boxes */
.charbox {
  width: fit-content;
/*  font-size: 0.8em;*/
  height: 1em;
  position: relative;
  display: inline-block;
  top: 0;
  left: 0;
  /* Makes the text look good */
  vertical-align: -0.1em;
}
.consonant {
  width: 1em;
  height: 1em;
}
.vowel {
  width: 0.3em;
  height: 0.3em;
}
/* width is variable */
.punctimg {
  height: 1em;
}
.syllable {
  width: 1em;
}

/* kerning happens here*/
.syllable + .syllable,.syllable .punct {
  /* The wug images have some spacing, remove that for better æsthetics */
  margin-left: -0.15em;
}

/* Position the consonant and vowel within their boxes */
.syllable .consonant {
  position: relative;
  top: 0;
  left: 0;
}
.syllable .vowel {
  position: absolute;
  left: 0.7em;
  z-index: 1;
}


/* If vowels are on voiceless bases, they can be made to live on the wugbeak.
   Currently not making this design choice. */
/*.syllable .vowel.voiceless-base {
  left: 0px;
}*/

/* Correctly position the vowels */
.syllable .vowel-fat_ha,.syllable .vowel-dommah,.syllable .vowel-schwa {
  top: -0.07em;
}
.syllable .vowel-kas_rah {
  top: 0.75em;
}

.unknown {
    color: red;
    width: fit-content;
}
#output {
    margin-top: 50px;
    font-size: 80px;
    line-height: 0.6;
}
</style>
</head>
<body>
<div id=form>
<label for=text>Text: </label><br><textarea id="text" name="text" rows=3 cols=70 onkeyup="update()"> </textarea><br>
<label for=fontsize>Set font size (px): </label> <input type=number name=fontsize id=fontsize value="80" onchange="setFontSize()"/><br>

IPA: <span id="ipa-output"></span><br>
Parsed: <span id="string-output"></span><br>
<details>
    <summary>How this works</summary>
<p>This uses the <a href="http://www.speech.cs.cmu.edu/cgi-bin/cmudict">CMU pronouncing dictionary</a> to convert text into IPA (with the same CMU-to-IPA mapping
as <a href="https://manishearth.github.io/ipadle/">IPAdle</a>), and then maps that to the Wug writing system. Currently leaving out details on how Wug works, figure it out!

<p>Writing system by [redacted]. Code by Manish.
</details>
<button onclick="document.getElementById('form').style.display = 'none'">Hide controls (for printing)</button>
</div>

<br><br><br>
<div id="output">


</div>

<script type="text/javascript">update();setFontSize()</script>
</body>
</html>
