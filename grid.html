<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abwugida — Carrier × Accessory grid</title>
    <style>
      @font-face {
        font-family: "Abwugida";
        src: url("font/Abwugida-Regular.ttf");
        font-weight: 400;
      }
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 1em;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1em;
        margin-bottom: 0.5em;
      }
      h1 {
        font-size: 1.2em;
        margin: 0;
      }
      .controls {
        margin-bottom: 0.5em;
        font-size: 0.9em;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 4px;
        text-align: center;
        vertical-align: middle;
      }
      th {
        font-size: 10px;
        font-weight: normal;
        color: #555;
        background: #f7f7f7;
        position: sticky;
        z-index: 1;
      }
      thead th {
        top: 0;
      }
      tbody th {
        left: 0;
      }
      thead th:first-child {
        left: 0;
        z-index: 2;
      }
      .glyph {
        font-family: "Abwugida";
        font-size: 36px;
        line-height: 1;
        display: inline-block;
        min-width: 1em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Carrier × Accessory</h1>
      <a href="index.html">← back to main</a>
    </header>
    <div class="controls">
      <label for="size">Glyph size (px):</label>
      <input type="number" id="size" value="36" min="8" max="200" />
    </div>
    <table id="grid"></table>
    <script>
      const carriers = [];
      for (let c = 0xe200; c <= 0xe211; c++) carriers.push(c);
      const accessories = [];
      for (let c = 0xe300; c <= 0xe316; c++) accessories.push(c);
      const fmt = (c) => "U+" + c.toString(16).toUpperCase();
      const table = document.getElementById("grid");

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headerRow.appendChild(document.createElement("th"));
      for (const acc of accessories) {
        const th = document.createElement("th");
        th.textContent = fmt(acc);
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const car of carriers) {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = fmt(car);
        tr.appendChild(th);
        for (const acc of accessories) {
          const td = document.createElement("td");
          const span = document.createElement("span");
          span.className = "glyph";
          span.textContent =
            String.fromCharCode(car) + String.fromCharCode(acc);
          td.appendChild(span);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);

      document.getElementById("size").addEventListener("input", (e) => {
        const px = e.target.value + "px";
        for (const g of document.getElementsByClassName("glyph")) {
          g.style.fontSize = px;
        }
      });
    </script>
  </body>
</html>
